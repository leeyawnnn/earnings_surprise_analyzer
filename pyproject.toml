[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-surprise-analyzer"
version = "0.2.0"
description = "Event study of post-earnings announcement drift on US equities"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lyonn Lie" }]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "requests>=2.31,<3",
    "pyarrow>=15",
    "statsmodels>=0.14,<1",
    "yfinance>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "lxml>=5",
]

[project.urls]
Homepage = "https://github.com/leeyawnnn/earnings_surprise_analyzer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PD", "NPY", "RUF"]
ignore = [
    "B905",   # zip(strict=) is noisy on equal-length numpy/pandas iterables
    # Chart labels and docstrings use real typography: a minus sign in
    # "Beat − Miss", a sigma for standard deviations, an en dash in date
    # ranges. Those are the correct characters, not lookalikes to be purged.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

# pandas-stubs is deliberately not a dev dependency. Its Series and Index
# return types are wide unions, so every float() and every label lookup needs a
# cast to satisfy them; that produced eighteen findings here, none of which was
# a defect. Without it pandas is untyped and the checker still covers this
# package's own signatures, which is where the value is.
[tool.mypy]
# 3.12, not the 3.11 floor: numpy's bundled stubs use `type` statements that
# older target versions reject outright, which stops the check before it
# starts. The runtime floor stays at 3.11 and CI exercises it.
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires live network access (deselected by default in CI)",
]
filterwarnings = ["error::RuntimeWarning"]
